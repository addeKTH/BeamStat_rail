<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Railway bridge - static analysis</title>
<style>
  :root { --bg:#f0f0f0; --pan:#fafafa; --line:#d5d5d5; --ink:#222; }
  * { box-sizing: border-box; }
  body { margin:0; padding:12px; background:var(--bg); color:var(--ink);
         font:13px/1.4 system-ui,"Segoe UI",Helvetica,Arial,sans-serif; }
  h1 { font-size:15px; font-weight:600; margin:0 0 10px; }
  h1 span { font-weight:400; color:#666; }
  .wrap { max-width:900px; margin:0 auto; }

  .panel { background:var(--pan); border:1px solid var(--line); border-radius:4px;
           padding:10px 12px; margin-bottom:10px;
           display:grid; grid-template-columns:repeat(4,1fr); gap:4px 18px; }
  .grp { display:flex; flex-direction:column; gap:4px; }
  .grp > b { font-size:11px; text-transform:uppercase; letter-spacing:.04em;
             color:#555; margin-bottom:2px; }
  .fld { display:grid; grid-template-columns:74px 1fr; align-items:center; gap:6px; }
  .fld label { font-size:11px; color:#444; }
  input, select, textarea { font:12px inherit; font-family:inherit; padding:2px 4px;
           border:1px solid #bbb; border-radius:3px; background:#fff; width:100%; }
  input:disabled, select:disabled { background:#eee; color:#999; }
  textarea { height:52px; font-family:ui-monospace,Consolas,monospace; font-size:11px; }
  .chk { display:flex; align-items:center; gap:6px; font-size:11px; color:#444; }
  .chk input { width:auto; }

  .bar { display:flex; align-items:center; gap:8px; grid-column:1/-1;
         border-top:1px solid var(--line); padding-top:8px; margin-top:2px; }
  button { font:12px inherit; padding:3px 10px; border:1px solid #bbb; border-radius:3px;
           background:#fff; cursor:pointer; }
  button:hover { background:#eee; }
  #msg { font-size:11px; color:#555; }
  #msg.warn { color:#a00; } #msg.ok { color:#070; }

  .figs { background:var(--pan); border:1px solid var(--line); border-radius:4px; padding:6px 4px; }
  canvas { display:block; width:100%; }
  #cvBeam { height:120px; cursor:crosshair; touch-action:none; }
  .cvp { height:130px; }
  .hint { font-size:11px; color:#777; text-align:right; padding:0 16px 2px 0; }
  footer { font-size:11px; color:#777; margin:10px 0 20px; }
  code { font-family:ui-monospace,Consolas,monospace; background:#e8e8e8; padding:0 3px; border-radius:2px; }
</style>
</head>
<body>
<div class="wrap">

<h1>Railway bridge &ndash; static analysis <span>&middot; influence lines and design train load effects</span></h1>

<div class="panel">
  <div class="grp">
    <b>Bridge</b>
    <div class="fld"><label>L (m)</label><input id="inL" value="24 30 24"></div>
    <div class="fld"><label>EI (Nm²)</label><input id="inEI" value="30E9"></div>
    <div class="fld"><label>dL (m)</label><input id="indL" value="0.2"></div>
  </div>

  <div class="grp">
    <b>Load distribution</b>
    <div class="fld"><label>w (m)</label><input id="inW" value="0"></div>
    <div class="fld"><label>shape</label>
      <select id="inShp"><option value="rect">rect</option><option value="tri">tri</option></select></div>
  </div>

  <div class="grp">
    <b>Train</b>
    <div class="fld"><label>model</label><select id="inTrain"></select></div>
    <div class="fld"><label>wagons</label><input id="inWag" value="10"></div>
    <div class="chk"><input type="checkbox" id="inPhi" checked><label for="inPhi">dynamic factor &phi;</label></div>
  </div>

  <div class="grp">
    <b>Plot</b>
    <div class="fld"><label>xp (m)</label><input id="inXp" value="39"></div>
    <div class="fld"><label>quantity</label>
      <select id="inQty"><option value="d">d</option><option value="r">r</option><option value="RF">RF</option></select></div>
    <div class="fld"><label>peak</label>
      <select id="inPeak"><option value="max">max</option><option value="min">min</option></select></div>
    <div class="fld"><label>show</label>
      <select id="inShow"><option value="section">section</option><option value="critical">critical</option><option value="envelope">envelope</option></select></div>
  </div>

  <div class="bar">
    <button id="btnMax">Save max</button>
    <button id="btnReset">Reset</button>
    <span id="msg"></span>
  </div>
</div>

<div class="figs">
  <div class="hint">drag the marker to move the section &middot; click a support symbol to change b.c.</div>
  <canvas id="cvBeam"></canvas>
  <canvas id="cv1" class="cvp"></canvas>
  <canvas id="cv2" class="cvp"></canvas>
  <canvas id="cv3" class="cvp"></canvas>
</div>
<footer>Last updated 2026-07-30 </footer>
</div>
<script src="beam.js"></script>
<script src="trains.js"></script>
<script src="loadeffect.js"></script>
<script src="plot.js"></script>
<script src="xlsx.js"></script>
<script src="app.js"></script>
</body>
</html>
